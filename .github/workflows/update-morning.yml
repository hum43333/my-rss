name: Update Morning Briefing RSS

on:
  schedule:
    - cron: '0 21 * * *'  # UTC 21:00 = 한국/일본시간 오전 6:00
  workflow_dispatch:       # 수동 실행 버튼

jobs:
  update-morning:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 모닝 브리핑 RSS 생성
        run: python make_rss_morning.py

      - name: XML 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add morning_briefing.xml
          git diff --cached --quiet || git commit -m "🌅 모닝 브리핑 갱신 $(date '+%Y-%m-%d')"
          git push
