name: Update Yonhap RSS

on:
  schedule:
    - cron: '0 * * * *'   # 매시간 정각 자동 실행
  workflow_dispatch:        # 수동 실행 버튼도 활성화

jobs:
  update-rss:
    runs-on: ubuntu-latest  # GitHub 서버(우분투)에서 실행

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: RSS 스크립트 실행
        run: python make_rss.py

      - name: 변경된 XML 파일 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yonhap_top20.xml
          git diff --cached --quiet || git commit -m "🔄 RSS 자동 갱신 $(date '+%Y-%m-%d %H:%M')"
          git push
